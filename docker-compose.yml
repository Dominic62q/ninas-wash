# The server side of Niinas Wash: the API and Postgres. Nothing is published to the internet from here.
# HTTPS is done by the Caddy that already runs on the server: it reaches the API over the shared Docker network
# (see deploy/install-caddy-site.sh). Settings come from a .env file next to this one (copy deploy/.env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: niinas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: niinas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U niinas -d niinas']
      interval: 10s
      timeout: 5s
      retries: 5

  # Named niinas-api, not api: it joins a network shared with other apps, and a plain "api" could be mistaken for theirs.
  niinas-api:
    build: .
    restart: unless-stopped
    init: true
    container_name: niinas-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://niinas:${POSTGRES_PASSWORD}@db:5432/niinas
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env (the Vercel address)}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-NiinasWash}
    expose:
      - '3001'
    networks:
      - default
      - edge

networks:
  # The network the server's Caddy is on. It must already exist (docker network ls). Set EDGE_NETWORK in .env if it differs.
  edge:
    name: ${EDGE_NETWORK:-rigel-medsgh_rigel-network}
    external: true

volumes:
  pgdata:
